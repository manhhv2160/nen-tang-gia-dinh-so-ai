# Mỗi service ở cổng nội bộ riêng và KHÔNG mở ra ngoài; chỉ gateway (8080) và web (3000) có "ports".
name: familyconnect
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-familyconnect_secret_key_2026}
      AUTH_URL: http://auth-service:3001
      GENEALOGY_URL: http://genealogy-service:3002
      COMMUNITY_URL: http://community-service:3003
      EVENT_URL: http://event-service:3004
      HERITAGE_URL: http://heritage-service:3005
      AI_URL: http://ai-service:3006
      REPORT_URL: http://report-service:3007
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - auth-service
      - genealogy-service
      - community-service
      - event-service
      - heritage-service
      - ai-service
      - report-service

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-familyconnect_secret_key_2026}
      DATABASE_URL: postgres://auth_svc:auth_dev_pw@db:5432/auth_db
      SEED_DEFAULT_USERS: "${SEED_DEFAULT_USERS:-true}"
      DEFAULT_ADMIN_EMAIL: "${DEFAULT_ADMIN_EMAIL:-admin@familyconnect.test}"
      DEFAULT_ADMIN_PASSWORD: "${DEFAULT_ADMIN_PASSWORD:-FC-Local-Admin-2026!}"
      DEFAULT_TEST_EMAIL: "${DEFAULT_TEST_EMAIL:-test@familyconnect.test}"
      DEFAULT_TEST_PASSWORD: "${DEFAULT_TEST_PASSWORD:-FC-Local-User-2026!}"
    depends_on:
      db:
        condition: service_healthy

  genealogy-service:
    build:
      context: .
      dockerfile: services/genealogy-service/Dockerfile
    environment:
      PORT: 3002
      DATABASE_URL: postgres://genealogy_svc:genealogy_dev_pw@db:5432/genealogy_db
      AUTH_URL: http://auth-service:3001
      REPORT_URL: http://report-service:3007
    depends_on:
      - db
      - report-service

