# Mỗi service ở cổng nội bộ riêng và KHÔNG mở ra ngoài; chỉ gateway (8080) và web (3000) có "ports".
name: familyconnect
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      AUTH_URL: http://auth-service:3001
      GENEALOGY_URL: http://genealogy-service:3002
      COMMUNITY_URL: http://community-service:3003
      EVENT_URL: http://event-service:3004
      HERITAGE_URL: http://heritage-service:3005
      AI_URL: http://ai-service:3006
      REPORT_URL: http://report-service:3007
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - genealogy-service
      - community-service
      - event-service
      - heritage-service
      - ai-service
      - report-service

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgres://auth_svc:auth_dev_pw@db:5432/auth_db
    depends_on:
      - db

  genealogy-service:
    build:
      context: .
      dockerfile: services/genealogy-service/Dockerfile
    environment:
      PORT: 3002
      DATABASE_URL: postgres://genealogy_svc:genealogy_dev_pw@db:5432/genealogy_db
      AUTH_URL: http://auth-service:3001
    depends_on:
      - db

  community-service:
    build:
      context: .
      dockerfile: services/community-service/Dockerfile
    environment:
      PORT: 3003
      DATABASE_URL: postgres://community_svc:community_dev_pw@db:5432/community_db
      GENEALOGY_URL: http://genealogy-service:3002
    depends_on:
      - db

  event-service:
    build:
      context: .
      dockerfile: services/event-service/Dockerfile
    environment:
      PORT: 3004
      DATABASE_URL: postgres://event_svc:event_dev_pw@db:5432/event_db
      GENEALOGY_URL: http://genealogy-service:3002
    depends_on:
      - db

  heritage-service:
    build:
      context: .
      dockerfile: services/heritage-service/Dockerfile
    environment:
      PORT: 3005
      DATABASE_URL: postgres://heritage_svc:heritage_dev_pw@db:5432/heritage_db
      GENEALOGY_URL: http://genealogy-service:3002
    depends_on:
      - db

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    environment:
      PORT: 3006
      GENEALOGY_URL: http://genealogy-service:3002
      HERITAGE_URL: http://heritage-service:3005

  report-service:
    build:
      context: .
      dockerfile: services/report-service/Dockerfile
    environment:
      PORT: 3007
      DATABASE_URL: postgres://report_svc:report_dev_pw@db:5432/report_db
      AUTH_URL: http://auth-service:3001
      GENEALOGY_URL: http://genealogy-service:3002
      COMMUNITY_URL: http://community-service:3003
      EVENT_URL: http://event-service:3004
      HERITAGE_URL: http://heritage-service:3005
    depends_on:
      - db

  web:
    image: nginx:alpine
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - gateway

volumes:
  pgdata:
