<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FamilyConnect – Cây gia phả</title>
<link rel="stylesheet" href="css/base.css">
</head>
<body data-page="tree">
<div class="app">
<aside class="sidebar" id="sidebar"></aside>
<main class="main">
  <div class="page-head"><h1>Cây gia phả</h1></div>
  <div class="toolbar">
    <div><label for="family">Dòng họ</label><select id="family"></select></div>
    <div><label for="branch">Nhánh họ</label><select id="branch"><option value="">Tất cả nhánh</option></select></div>
    <div><label for="q">Tìm thành viên</label><input id="q" type="search" placeholder="Nhập tên..."></div>
    <div class="row tree-zoom">
      <button id="zoom-out" type="button" class="btn secondary small" aria-label="Thu nhỏ cây">Thu nhỏ</button>
      <button id="zoom-in" type="button" class="btn secondary small" aria-label="Phóng to cây">Phóng to</button>
      <button id="zoom-reset" type="button" class="btn secondary small">Đặt lại</button>
    </div>
  </div>
  <p id="tree-message" class="page-message" role="status" aria-live="polite"></p>
  <div class="split">
    <section class="card tree tree-viewport" aria-label="Cây gia phả">
      <div id="tree-content" class="tree-content"></div>
      <p class="muted tree-legend">Viền xanh: nam · viền hồng: nữ · nhãn thể hiện quan hệ con nuôi.</p>
    </section>
    <aside id="member-detail">
      <section class="card"><h2>Thông tin thành viên</h2><p class="muted">Chọn một nút trên cây để xem hồ sơ.</p></section>
    </aside>
  </div>
</main>
</div>
<script src="src/components/Layout.js"></script>
<script type="module" src="src/controllers/GenealogyController.js"></script>
</body>
</html>
