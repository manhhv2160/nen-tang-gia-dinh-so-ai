<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FamilyConnect - Bảng tin</title>
<link rel="stylesheet" href="css/base.css">
</head>
<body data-page="feed">
<div class="app">
<aside class="sidebar" id="sidebar"></aside>
<main class="main">
<div class="page-head"><h1>Bảng tin dòng họ</h1></div>

<div class="toolbar">
  <div><label for="family">Dòng họ</label><select id="family"></select></div>
  <div><label for="post-type">Loại bài đăng</label>
    <select id="post-type" data-enum="PostTypes" data-enum-all="Tất cả loại"></select></div>
</div>

<p id="feed-message" class="page-message" role="status" aria-live="polite"></p>

<section class="card">
  <h2>Tạo bài đăng</h2>
  <div class="form-grid">
    <div><label for="new-type">Loại bài</label>
      <select id="new-type" data-enum="PostTypes" data-enum-selected="GENERAL"></select></div>
    <div><label for="new-title">Tiêu đề (không bắt buộc)</label>
      <input id="new-title" maxlength="255"></div>
  </div>
  <label for="new-content">Nội dung</label>
  <textarea id="new-content" rows="3" maxlength="10000" placeholder="Chia sẻ với gia đình..."></textarea>
  <p class="row"><button type="button" class="btn" id="post-submit">Đăng bài</button></p>
</section>

<div id="posts"></div>
</main>
</div>
<script src="src/components/Layout.js"></script>
<script type="module" src="src/controllers/CommunityController.js"></script>
</body>
</html>
