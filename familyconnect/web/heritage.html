<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FamilyConnect – Di sản số</title>
<link rel="stylesheet" href="css/base.css">
</head>
<body data-page="heritage">
<div class="app">
<aside class="sidebar" id="sidebar"></aside>
<main class="main">
<div class="page-head"><h1>Di sản số</h1></div>
<label for="family-select">Dòng họ</label><select id="family-select"></select><p id="notice" role="alert"></p>
<details class="card" id="record-form"><summary>Thêm tài liệu di sản</summary>
  <div class="form-grid">
    <div><label for="h-type">Loại tài liệu</label><select id="h-type" data-enum="HeritageTypes"></select></div>
    <div><label for="h-title">Tiêu đề</label><input id="h-title"></div>
    <div><label for="h-file">Tệp đính kèm</label><input id="h-file" type="file"></div>
  </div>
  <label for="h-content">Nội dung</label><textarea id="h-content" rows="3"></textarea>
  <p><button type="button" class="btn" id="save-record">Lưu</button> <button type="button" class="btn" id="cancel-record">Hủy</button></p>
</details>
<section class="grid" id="records"></section>

</main>
</div>
<script src="src/components/Layout.js"></script>
<script type="module" src="src/components/EnumBinder.js"></script>
<script type="module" src="src/controllers/EventHeritageController.js"></script>
</body>
</html>
