<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FamilyConnect – Danh bạ</title>
<link rel="stylesheet" href="css/base.css">
</head>
<body data-page="members">
<div class="app">
<aside class="sidebar" id="sidebar"></aside>
<main class="main">
  <div class="page-head"><h1>Danh bạ thành viên</h1></div>
  <div class="toolbar">
    <div><label for="family">Dòng họ</label><select id="family"></select></div>
    <div><label for="branch">Nhánh họ</label><select id="branch"><option value="">Tất cả nhánh</option></select></div>
    <div><label for="s">Tìm kiếm</label><input id="s" type="search" placeholder="Tên, nghề nghiệp, nơi ở..."></div>
    <div><label for="f-gen">Thế hệ</label><select id="f-gen"><option value="">Tất cả thế hệ</option></select></div>
    <div><label for="f-loc">Nơi ở</label><select id="f-loc"><option value="">Tất cả nơi ở</option></select></div>
    <div><label for="f-verified">Xác minh</label><select id="f-verified"><option value="">Tất cả</option><option value="true">Đã xác minh</option><option value="false">Chờ duyệt</option></select></div>
  </div>
  <p id="members-message" class="page-message" role="status" aria-live="polite"></p>
  <section class="card table-wrap">
    <table>
      <thead><tr><th>Họ tên</th><th>Giới tính</th><th>Ngày sinh</th><th>Thế hệ</th><th>Nghề nghiệp</th><th>Nơi ở</th><th>Xác minh</th><th></th></tr></thead>
      <tbody id="members-list"></tbody>
    </table>
  </section>
</main>
</div>
<script src="src/components/Layout.js"></script>
<script type="module" src="src/controllers/GenealogyController.js"></script>
</body>
</html>
