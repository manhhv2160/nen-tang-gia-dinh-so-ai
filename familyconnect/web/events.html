<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FamilyConnect – Sự kiện</title>
<link rel="stylesheet" href="css/base.css">
</head>
<body data-page="events">
<div class="app">
<aside class="sidebar" id="sidebar"></aside>
<main class="main">
<div class="page-head"><h1>Sự kiện dòng họ</h1></div>
<label for="family-select">Dòng họ</label><select id="family-select"></select><p id="notice" role="alert"></p>
<details class="card" id="record-form"><summary>Tạo sự kiện mới</summary>
  <div class="form-grid">
    <div><label for="ev-title">Tên sự kiện</label><input id="ev-title"></div>
    <div><label for="ev-loc">Địa điểm</label><input id="ev-loc"></div>
    <div><label for="ev-start">Bắt đầu</label><input id="ev-start" type="datetime-local"></div>
    <div><label for="ev-end">Kết thúc</label><input id="ev-end" type="datetime-local"></div>
  </div>
  <label for="ev-desc">Mô tả</label><textarea id="ev-desc" rows="3"></textarea>
  <p><button type="button" class="btn" id="save-record">Lưu</button> <button type="button" class="btn" id="cancel-record">Hủy</button></p>
</details>

<section class="grid" id="records"></section>
<section class="card" id="participants"></section>
</main>
</div>
<script src="src/components/Layout.js"></script>
<script type="module" src="src/components/EnumBinder.js"></script>
<script type="module" src="src/controllers/EventHeritageController.js"></script>
</body>
</html>
