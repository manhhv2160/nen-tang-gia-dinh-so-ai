<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FamilyConnect – Đăng nhập</title>
<link rel="stylesheet" href="css/base.css">
</head>
<body class="auth">
<main class="auth-card">
  <div class="logo">FamilyConnect</div>
  <p class="muted">Nền tảng cộng đồng gia đình số</p>
  <div class="tabs">
    <input type="radio" name="tab" id="t-login" checked>
    <input type="radio" name="tab" id="t-reg">
    <div class="tab-labels"><label for="t-login">Đăng nhập</label><label for="t-reg">Đăng ký</label></div>

    <form class="panel" id="p-login" novalidate>
      <div class="field"><label for="l-email">Email</label><input id="l-email" name="email" type="email" autocomplete="username"></div>
      <div class="field"><label for="l-pass">Mật khẩu</label><input id="l-pass" name="password" type="password" autocomplete="current-password"></div>
      <div class="muted" id="login-error" role="alert"></div>
      <!-- type="button": AuthController sẽ gắn sự kiện, tránh mật khẩu bị đưa lên URL -->
      <button type="button" class="btn" id="btn-login">Đăng nhập</button>
    </form>

    <form class="panel" id="p-reg" novalidate>
      <div class="field"><label for="r-name">Họ và tên</label><input id="r-name" name="full_name" autocomplete="name"></div>
      <div class="field"><label for="r-email">Email</label><input id="r-email" name="email" type="email" autocomplete="email"></div>
      <div class="field"><label for="r-phone">Số điện thoại</label><input id="r-phone" name="phone" type="tel"></div>
      <div class="field"><label for="r-pass">Mật khẩu (từ 8 ký tự)</label><input id="r-pass" name="password" type="password" autocomplete="new-password"></div>
      <div class="field"><label for="r-pass2">Nhập lại mật khẩu</label><input id="r-pass2" type="password" autocomplete="new-password"></div>
      <div class="muted">Tài khoản mới có vai trò Khách, cần quản trị viên dòng họ xác minh để trở thành thành viên.</div>
      <button type="button" class="btn" id="btn-register">Tạo tài khoản</button>
    </form>
  </div>
</main>
</body>
</html>
